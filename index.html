<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wave Tracker - Home</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><img src="logo.png" alt="Wave Tracker Logo" class="header-logo"> Wave Tracker</h1>
      <p>Track It. Ride It. Own It.</p>

      <!-- Tab Navigation -->
      <div class="tab-nav">
         <a href="index.html" class="tab-link active">Home</a>
         <a href="Demo.html" class="tab-link">Demo</a>
      </div>
    </div>

    <div class="content">
      
      <div id="Home" class="tab-content active">
         <h2>Welcome to Wave Tracker</h2>
         <p>Wave Tracker helps you track, analyze waves patterns and increase surfing performance.</p>
         <p>Click "Demo" above to try the application.</p>
         <p></p>
         <div id="videoContainer">
          <video id="videoPlayer" controls autoplay muted loop preload="metadata" src="Short_Caion_2025-12-30.mp4" width="854" height="480" style="width: 854px; height: 480px;"></video> 
        </div>
      </div>

    </div>
  </div>
  <script>
    // Variables
    let tulips = [];
    let videoWidth = 640;
    let videoHeight = 480;
    
    // Elements
    const videoPlayer = document.getElementById('videoPlayer');
    
    // Canvas setup
    const canvas = document.createElement('canvas');
    canvas.style.position = 'absolute';
    canvas.style.pointerEvents = 'none';
    canvas.style.display = 'block';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.zIndex = '10';
    
    const videoContainer = document.getElementById('videoContainer');
    if (videoContainer) {
      videoContainer.style.position = 'relative';
      videoContainer.appendChild(canvas);
    }
    
    // Helper functionality
    function ensureVideoReady(video) {
        return new Promise(resolve => {
            if (!video.src && !video.currentSrc) { resolve(); return; }
            if (video.readyState >= 1 && video.videoWidth) { resolve(); } 
            else {
                video.addEventListener('loadedmetadata', () => resolve(), { once: true });
                setTimeout(resolve, 2000);
            }
        });
    }

    function setVideoDisplaySize(w, h) {
        if (w && h) {
            videoWidth = w;
            videoHeight = h;
            updateCanvasSize();
        }
    }

    function updateCanvasSize() {
        const video = document.getElementById('videoPlayer');
        if (!video) return;
        const w = video.offsetWidth || videoWidth || 640;
        const h = video.offsetHeight || videoHeight || 480;
        
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
        }
    }
    window.addEventListener('resize', () => {
        updateCanvasSize();
        if (tulips.length > 0) redrawPositions();
    });

    // Data Loading
    async function loadAndShowDetections() {
      try {
        // Load data
        const res = await fetch('measurements.json?t=' + new Date().getTime());
        if (res.ok) {
           const rawData = await res.json();
           tulips = rawData.map(item => ({
               id: item.id || item.wave_id || 'Unknown',
               x: item.position && typeof item.position.x === 'number' ? item.position.x : 0,
               y: item.position && typeof item.position.y === 'number' ? item.position.y : 0
           }));
           
           // Determine universe size
           if (videoPlayer.videoWidth) {
              videoWidth = videoPlayer.videoWidth;
              videoHeight = videoPlayer.videoHeight;
           } else {
              const maxX = Math.max(...tulips.map(t => t.x), 0);
              const maxY = Math.max(...tulips.map(t => t.y), 0);
              if (maxX > 640) videoWidth = Math.max(videoWidth, 1280);
              if (maxY > 480) videoHeight = Math.max(videoHeight, 720);
           }
           setVideoDisplaySize(videoWidth, videoHeight);
           
           // Show dots
           await redrawPositions();
        }
      } catch (e) {
        console.error("Error loading data", e);
      }
    }

    async function redrawPositions() {
        await ensureVideoReady(videoPlayer);
        
        if (videoPlayer.videoWidth) {
            videoWidth = videoPlayer.videoWidth;
            videoHeight = videoPlayer.videoHeight;
        }
        
        updateCanvasSize();
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    
        const scaleX = canvas.width / videoWidth;
        const scaleY = canvas.height / videoHeight;
        
        tulips.forEach(({id, x, y}) => {
            const scaledX = x * scaleX;
            const scaledY = y * scaleY;
            
            ctx.beginPath();
            ctx.arc(scaledX, scaledY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#ff0000';
            ctx.fill();
            
            ctx.font = 'bold 14px Arial';
            ctx.fillStyle = '#ff0000';
            ctx.fillText(id, scaledX + 12, scaledY + 4);
        });
    }

    // Init
    videoPlayer.addEventListener('loadedmetadata', () => {
      const w = videoPlayer.videoWidth || videoWidth;
      const h = videoPlayer.videoHeight || videoHeight;
      setVideoDisplaySize(w, h);
      redrawPositions();
    });

    document.addEventListener('DOMContentLoaded', loadAndShowDetections);
  </script>
</body>
</html>
